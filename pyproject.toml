[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oborot"
version = "0.1.0"
description = "Async warehouse operations and reliable inventory analytics"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.11,<4",
  "SQLAlchemy>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<7",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "pytest-aiohttp>=1.0,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["common*", "inventory_api*", "analytics_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 100
# Preserve the user-owned PyCharm starter; executable services live in packages.
extend-exclude = ["main.py", ".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
