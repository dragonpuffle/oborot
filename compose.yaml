services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oborot
      POSTGRES_PASSWORD: oborot
      POSTGRES_DB: oborot
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oborot -d oborot"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://oborot:oborot@postgres:5432/oborot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
  inventory_api:
    build: .
    command: ["python", "-m", "inventory_api"]
    environment: *app_env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
  analytics_worker:
    build: .
    command: ["python", "-m", "analytics_worker"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
